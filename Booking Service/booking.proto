syntax = "proto3";

package booking;

message ReqAddBooking {
    int32 user_id = 1;
    int32 schedule_id = 2;
    repeated int32 seat_ids = 3;
}

message ResAddBooking {
    int32 booking_id = 1;
    int32 status = 2;
    string msg = 3;
}

service BookingService {
    rpc AddBooking(ReqAddBooking) returns (ResAddBooking);
}