syntax = "proto3";

package bus_service;

//  -------------------------Bus---------------------------------
message Bus {
    int32 id = 1;
    string manufacturer = 2;
    string bus_number = 3;   
    string bus_type = 4;
    int32 model_id = 5;
}     

message ReqBus {
    string bus_number = 1;
}

message ResBus {
    int32 status = 1;
    string msg = 2;
    Bus bus = 3;
}

message ReqBuses {
    int32 limit = 1;
    int32 skip = 2;
}

message ResBuses {
    int32 status = 1;
    string msg = 2;
    repeated Bus buses = 3;
}

message ReqAddBus {
    string manufacturer = 1;
    string bus_number = 2;   
    string bus_type = 3;
    int32 model_id = 4;
}

message ResAddBus {
    int32 status = 1;
    string msg = 2;
}

message ReqDeleteBus {
    string bus_number = 1;
}

message ResDeleteBus {
    int32 status = 1;
    string msg = 2;
}

message ReqUpdateBus {
    Bus bus = 1;
}

message ResUpdateBus {
    int32 status = 1;
    string msg = 2;
}

// -------------------------Seat------------------------

message ReqAddSeat {
    string seat_number = 1;
    int32 model_id = 2;
}

message ResAddSeat {
    int32 status = 1;
    string msg = 2;
    int32 seat_id = 3;
}

message ReqDeleteSeat {
    int32 model_id = 1;
    string seat_number = 2;
}

message ResDeleteSeat {
    int32 status = 1;
    string msg = 2;
}

// -------------------------Model-----------------------

message Model {
    int32 model_id = 1;
    string model_name = 2;
}
message ReqGetModels {
    int32 limit = 1;
    int32 skip = 2;
}

message ResGetModels {
    int32 status = 1;
    string msg = 2;
    repeated Model models = 3;
}

message ReqGetModel {
    int32 model_id = 1;
}
message Seat {
    int32 seat_id = 1;
    string seat_name = 2;
}
message ResGetModel {
    int32 status = 1;
    string msg = 2;
    repeated Seat seats = 3;
}

message ReqAddModel {
    string model_name = 1;
}

message ResAddModel {
    int32 status = 1;
    string msg = 2;
    int32 model_id = 3;
}

// -------------------------------Route-------------------------

message ReqAddRoute {
    string source = 1;
    string destination = 2;
    int32 distance = 3;
}

message ResAddRoute {
    int32 route_id = 1;
    int32 status = 2;
    string msg = 3;
}

message ReqGetRoute {
    int32 route_id = 1;
}

message ResGetRoute {
    int32 status = 1;
    string msg = 2;
    string source = 3;
    string destination = 4;
    int32 distance = 5;
    int32 route_id = 6;
}

// ------------------------------Schedules------------------------  
// id | scheduled_date | departure_time | arrival_time | fare | status | created_at | bus_id | route_id

message ReqAddSchedule {
    string scheduled_date = 1;
    string departure_time = 2;
    string arrival_time = 3;
    int32 fare = 4;
    int32 bus_id = 5;
    int32 route_id = 6;
} 

message ResAddSchedule {
    int32 status = 1;
    string msg = 2;
    int32 schedule_id = 3;
}

message ReqUpdateSchedule {
    string scheduled_date = 1;
    string departure_time = 2;
    string arrival_time = 3;
    int32 fare = 4;
    int32 bus_id = 5;
    int32 route_id = 6;
    string status = 7;
}

message ResUpdateSchedule {
    int32 status = 1;
    string msg = 2;
}

message ReqDeleteSchedule {
    int32 schedule_id = 1;
}

message ResDeleteSchedule {
    int32 status = 1;
    string msg = 2;
}

message ReqGetSchedule {
    int32 schedule_id = 1;
}

message ResGetSchedule {
    string scheduled_date = 1;
    string departure_time = 2;
    string arrival_time = 3;
    int32 fare = 4;
    int32 bus_id = 5;
    int32 route_id = 6;
    int32 status = 7;
    int32 schedule_id = 8;
}

message Schedule {
    string scheduled_date = 1;
    string departure_time = 2;
    string arrival_time = 3;
    int32 fare = 4;
    int32 bus_id = 5;
    int32 route_id = 6;
    string status = 7;
    int32 schedule_id = 8;
}

message ReqGetSchedules {
    int32 limit = 1;
    int32 skip = 2;
}

message ResGetSchedules {
    int32 status = 1;
    string msg = 2;
    repeated Schedule schedules = 3;
}

message Route {
    int32 id = 1;
    string source = 2;
    string destination = 3;
    int32 distance = 4;
}
message GetScheduledBusesRequest {
    int32 limit = 1;
    int32 skip = 2;
}

message GetScheduledBusesByRouteRequest {
    string source = 1;
    string destination = 2;
    int32 limit = 3;
    int32 skip = 4;
}
message GetScheduledBusesResponse {
    int32 status = 1;
    string msg = 2;
    repeated Schedule schedules = 3;
}

// ========================= Services =========================

service BusService {
    // ---------------- Bus ----------------
    rpc GetBus(ReqBus) returns (ResBus);
    rpc GetBuses(ReqBuses) returns (ResBuses);
    rpc AddBus(ReqAddBus) returns (ResAddBus);
    rpc UpdateBus(ReqUpdateBus) returns (ResUpdateBus);
    rpc DeleteBus(ReqDeleteBus) returns (ResDeleteBus);

    // ---------------- Seat ----------------
    rpc AddSeat(ReqAddSeat) returns (ResAddSeat);
    rpc DeleteSeat(ReqDeleteSeat) returns (ResDeleteSeat);

    // ---------------- Model ----------------
    rpc GetModels(ReqGetModels) returns (ResGetModels);
    rpc GetModel(ReqGetModel) returns (ResGetModel);
    rpc AddModel(ReqAddModel) returns (ResAddModel);

    // ---------------- Route ----------------
    rpc AddRoute(ReqAddRoute) returns (ResAddRoute);
    rpc GetRoute(ReqGetRoute) returns (ResGetRoute);

    // ---------------- Schedule ----------------
    rpc AddSchedule(ReqAddSchedule) returns (ResAddSchedule);
    rpc UpdateSchedule(ReqUpdateSchedule) returns (ResUpdateSchedule);
    rpc DeleteSchedule(ReqDeleteSchedule) returns (ResDeleteSchedule);
    rpc GetSchedule(ReqGetSchedule) returns (ResGetSchedule);
    rpc GetSchedules(ReqGetSchedules) returns (ResGetSchedules);
    rpc GetScheduledBuses(GetScheduledBusesRequest) returns (GetScheduledBusesResponse);
    rpc GetScheduledBusesByRoute(GetScheduledBusesByRouteRequest) returns (GetScheduledBusesResponse);
}