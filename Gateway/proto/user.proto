syntax = "proto3";

package user;

message ReqLogin {
  string email = 1;
  string password = 2;
}

message ResLogin {
  bool success = 1;
  string token = 2;
  string message = 3;
  int32 status = 4;
}

message ReqRegister {
  string name = 1;
  string email = 2;
  int64 number = 3;
  string dob = 4;
  string password = 5;
}

message ResRegister {
  bool success = 1;
  string message = 2;
  int32 user_id = 3;
  int32 status = 4;
}

message ReqAdminLogin {
  string email = 1;
  string password = 2;
}

message ResAdminLogin {
  bool sucess = 1;
  string token = 2;
  string message = 3;
  int32 status = 4;
}

message ReqUser {
  string token = 1;
}

message ResUser {
  string name = 1;
  string email = 2;
  int64 number = 3;
  string dob = 4;
  bool success = 5;
  int32 status = 6;
  string role = 7;
  int32 id = 8;
  string message = 9;
}

message ReqVerification {
  string email = 1;
  int32 code = 2;
}

message ResVerification {
  string success = 1;
  string message = 2;
  int32 status = 3;
}

service UserService {
  rpc userLogin(ReqLogin) returns (ResLogin);
  rpc userRegister(ReqRegister) returns (ResRegister);
  rpc getUser(ReqUser) returns (ResUser);
  rpc adminLogin(ReqAdminLogin) returns (ResAdminLogin);
  rpc verifyUser(ReqVerification) returns (ResVerification);
}
